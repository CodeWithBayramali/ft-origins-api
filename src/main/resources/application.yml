spring:
  application:
    name: ft-origins

  datasource:
    url: jdbc:postgresql://localhost:5432/football_origins
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 20
        format_sql: false

  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migrations
    baseline-on-migrate: false

  threads:
    virtual:
      enabled: true

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-key-change-in-production-must-be-at-least-64-bytes-long-0123456789}
      issuer: footballorigins-api
      access-token-expiration-ms: 900000        # 15 minutes
      refresh-token-expiration-ms: 5184000000   # 60 days (sliding: resets on every refresh)
    cors:
      allowed-origins:
        - http://localhost:8081
        - http://localhost:19006
        - https://footballorigins.app
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - Accept
        - Origin
        - X-Requested-With
      exposed-headers:
        - Authorization
      allow-credentials: true
      max-age: 3600

  geo:
    # A team's H3 cell is only its uniqueness key (membership is the join circle, app.team.join-radius-km).
    # res 11 (about 25 m edge) is finer than any two team anchors usually sit apart, so a new team almost
    # always gets its own pin's cell and crowded spots still have free cells next to it. Teams filed under
    # an older resolution keep their keys; keys of different resolutions never collide.
    h3-resolution: 11
    # GeoNames reference data (reverse-geocode pin -> country/city labels).
    # Default path is relative to the working dir (= project root when run from IntelliJ/Gradle).
    # Override with the env var to point elsewhere (e.g. an absolute path).
    countries-file: ${GEO_COUNTRIES_FILE:geo-data/countryInfo.txt}   # GeoNames countryInfo.txt; empty = skip load
    cities-file: ${GEO_CITIES_FILE:geo-data/cities1000.txt}          # GeoNames cities1000.txt; empty = skip load (offline fallback)

    # OSM/Nominatim reverse-geocode → neighborhood (semt/mahalle) + district + city labels.
    # Called once per brand-new H3 cell (registration only) → low volume. On failure we fall back
    # to the GeoNames nearest-city above. Public server allows ~1 req/s and REQUIRES a real User-Agent
    # with contact info; for production scale point the url at a self-hosted / paid instance.
    nominatim:
      enabled: ${NOMINATIM_ENABLED:true}
      url: ${NOMINATIM_URL:https://nominatim.openstreetmap.org}
      user-agent: '${NOMINATIM_USER_AGENT:ft-origins/1.0 (contact bdurak3@gmail.com)}'
      language: ${NOMINATIM_LANGUAGE:en}   # place-name language; set to 'tr' for Turkish names

  team:
    # Players registering within this radius (km) of an existing team's anchor join that team — the circle
    # the registration map draws. Lower = more local teams; higher = wider catchment. 0.075 = about a block.
    join-radius-km: ${TEAM_JOIN_RADIUS_KM:0.075}
    # Team capacity: full teams are skipped at join time (next-nearest in range, else a new team).
    # Matches are 6v6 (1 GK + 5 outfield), so 10 leaves a real bench for substitutions.
    max-members: ${TEAM_MAX_MEMBERS:10}

  match:
    # Lineup edits close this many minutes before kickoff; from then on the kickoff job owns the
    # lineup (stat snapshots + AI fillers for empty slots).
    lineup-lock-minutes: ${MATCH_LINEUP_LOCK_MINUTES:15}
    # One match at a time per team: booking fails when either side already has a scheduled/live
    # match within this many minutes of the requested kickoff (covers the real-time window a live
    # simulated match runs, plus buffer).
    conflict-window-minutes: ${MATCH_CONFLICT_WINDOW_MINUTES:30}
    # Friendlies can be booked at most this many days ahead.
    max-schedule-days-ahead: ${MATCH_MAX_SCHEDULE_DAYS_AHEAD:7}
    # Live pacing: one simulated match minute per this many real seconds (8 -> a 90' match runs in
    # 12 real minutes). Overdue minutes (downtime, missed kickoffs) are caught up in one burst.
    sim-minute-real-seconds: ${MATCH_SIM_MINUTE_REAL_SECONDS:8}
    # How often the scheduler starts due kickoffs and advances live matches.
    tick-millis: ${MATCH_TICK_MILLIS:2000}
    # Founder live substitutions per team per match. No re-entry once subbed out.
    max-substitutions: ${MATCH_MAX_SUBSTITUTIONS:3}
    # Attribute value of the standard AI fillers that complete short-handed lineups.
    ai-fill-rating: ${MATCH_AI_FILL_RATING:40}